[package]
name = "bw-demo"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bw-core.workspace = true
anyhow.workspace = true
bevy.workspace = true
serde.workspace = true
serde_json.workspace = true
dhat = { version = "0.3.3", optional = true }

[features]
# Allocation pass build (ADR 0003): separate build/run so the tracking
# allocator never perturbs timing measurements (D8.8). dhat-rs powers it:
# HeapStats totals for window/per-tick series, Region + Probe guards for
# per-function attribution.
perf-alloc = ["dep:dhat"]

[lints]
workspace = true
