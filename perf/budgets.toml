# Performance budgets enforced by `cargo xtask perf check` (ADR 0001, D3).
#
# A breach fails CI. The only remedies are making the code smaller/faster or
# raising the budget here, in a visible diff, with the `note` updated to say
# why. Ratcheting down is always allowed.

schema = 1
reviewed = "2026-09-22"

[scope]
# Workspace members whose dependency graphs count toward the dep budget.
# Tooling (xtask) stays out so its dependencies never count against the
# game's footprint.
measured_members = ["bw-core", "bw-demo", "bw-tree-gallery"]

[artifact.bw-demo]
# size-profile native binary, host target. Bevy minimal + sim core +
# headless gallery harness (ADRs 0002-0004). Measured 1,095,424 bytes
# after the dense-grid refactor; unchanged budget. Prior baselines:
# 289,800 (no bevy), 1,030,544 (bevy, pre-gallery), 1,095,656 (hash grid).
budget_bytes = 1110000
note = "bevy 0.19.1 minimal + sim core + headless gallery harness (ADR 0002/0003/0004)"

[artifact.bw-tree-gallery]
# size-profile native binary, host target. Same dependency set as bw-demo
# (no new external crates) plus the golden-ratio tree core and the tactical
# SVG renderer. Measured 1,145,088 bytes at introduction.
budget_bytes = 1170000
note = "bevy 0.19.1 minimal + tree core + headless gallery harness + SVG render path (ADR 0002/0003/0004)"

[deps]
# 12 -> 78 external crates with bevy minimal (ADR 0002). Further raises are
# one deliberate, justified change at a time.
max_external_normal = 78
# Duplicated versions present in bevy 0.19.1's own graph (upstream, not
# ours): bevy macro crates use syn 2 while serde uses syn 3; bevy_platform
# pins hashbrown 0.16 while indexmap uses 0.17.
allowed_duplicates = ["syn", "hashbrown"]

# Instruction-count budgets (gate tier, ADR 0001 D2). iai counts vary by
# ~0.1% between builds of identical code (address-dependent alignment), so
# budgets carry ~2% headroom over measured baselines rather than being
# exact.

[bench."iai_sim::sim::step step_1000:setup_sim_1000()"]
max_instructions = 13300
note = "baseline 13,005; 1000-entity sim tick"

[bench."iai_sim::sim::grid_rebuild rebuild_1000:setup_grid()"]
max_instructions = 720000
note = "baseline 705,832; dense counting-sort rebuild over 1000 entities (replaced hash build at 646,330 — +9% instructions for zero-alloc rebuild, query 3.8x cheaper)"

[bench."iai_sim::sim::grid_query query_1000:setup_query()"]
max_instructions = 400000
note = "baseline 391,502; broadphase pair query into reused scratch (was 1,490,561 via allocating hash query)"

# Steady-state allocation budgets (ADR 0004): blocks per tick in the
# measured window; the gate fails on the worse of p50 and max. Zero means
# zero — exceptions are visible raises with notes, like every other budget.

[steady."bw-demo::bounce"]
max_blocks_per_tick = 0
note = "allocate-once rule; scratch sized to entity count at setup"

[steady."bw-demo::bounce-big"]
max_blocks_per_tick = 0
note = "allocate-once rule; scratch sized to entity count at setup"

[steady."bw-tree-gallery::tree"]
max_blocks_per_tick = 0
note = "allocate-once rule; pose buffers allocated per tree at setup"

[steady."bw-tree-gallery::tree-storm"]
max_blocks_per_tick = 0
note = "allocate-once rule; same pose path as tree, stronger wind"

[steady."bw-tree-gallery::tree-grove"]
max_blocks_per_tick = 0
note = "allocate-once rule; one reused pose buffer per tree in the grove"

[advisory.build]
# Compile-time trend threshold; never a hard gate (ADR 0001, D2).
check_clean_growth_pct = 10
