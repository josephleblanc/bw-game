# Performance budgets enforced by `cargo xtask perf check` (ADR 0001, D3).
#
# A breach fails CI. The only remedies are making the code smaller/faster or
# raising the budget here, in a visible diff, with the `note` updated to say
# why. Ratcheting down is always allowed.

schema = 1
reviewed = "2026-09-22"

[scope]
# Workspace members whose dependency graphs count toward the dep budget.
# Tooling (xtask) stays out so its dependencies never count against the
# game's footprint.
measured_members = ["bw-core", "bw-demo"]

[artifact.bw-demo]
# size-profile native binary, host target. Step-up for the first Bevy
# dependency (ADR 0002): bevy 0.19.1, default-features = false. Measured
# 1,095,656 bytes after the first gallery + sim core landed (ADR 0003);
# budget set with ~1.3% headroom. Prior baselines: 289,800 (no bevy),
# 1,030,544 (bevy, pre-gallery).
budget_bytes = 1110000
note = "bevy 0.19.1 minimal + sim core + headless gallery harness (ADR 0002/0003)"

[deps]
# 12 -> 78 external crates with bevy minimal (ADR 0002). Further raises are
# one deliberate, justified change at a time.
max_external_normal = 78
# Duplicated versions present in bevy 0.19.1's own graph (upstream, not
# ours): bevy macro crates use syn 2 while serde uses syn 3; bevy_platform
# pins hashbrown 0.16 while indexmap uses 0.17.
allowed_duplicates = ["syn", "hashbrown"]

# Instruction-count budgets (gate tier, ADR 0001 D2). iai counts vary by
# ~0.1% between builds of identical code (address-dependent alignment), so
# budgets carry ~2% headroom over measured baselines rather than being
# exact.

[bench."iai_sim::sim::step step_1000:setup_sim_1000()"]
max_instructions = 13300
note = "baseline 13,005; 1000-entity sim tick"

[bench."iai_sim::sim::hash_build build_1000:setup_sim_1000()"]
max_instructions = 660000
note = "baseline 646,330; spatial hash build over 1000 entities"

[bench."iai_sim::sim::hash_query query_1000:setup_hash_1000()"]
max_instructions = 1525000
note = "baseline 1,491,261; broadphase pair query over 1000 entities"

[advisory.build]
# Compile-time trend threshold; never a hard gate (ADR 0001, D2).
check_clean_growth_pct = 10
